apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.fuzz-surface
  version: 1.0.0
  name: Fuzz de superfície — parâmetros e cabeçalho
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [FUZZ-01]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      bodyBytes: 65536
      requestHeaders: [Referer]
      requestHeaderCount: 1
      requestHeaderValueLength: 16384
  resources:
    timeoutSeconds: 18
    memoryMiB: 128
  permissions: [target.http.lab-active]
  execution:
    isolation: container
  riskClass: medium
