apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.mass-assignment
  version: 1.0.0
  name: Mass assignment — propriedades privilegiadas não declaradas (API-AUTHZ-04)
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [API-AUTHZ-04]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      identity: primary
      arbitraryPaths: true
      methods: [GET, POST, PUT, PATCH]
      requestBodyBytes: 65536
      requestContentTypes: [application/json]
      writeRequests: 12
      maxRequests: 30
      bodyBytes: 65536
      authenticatedResponseHeaders: true
  resources:
    timeoutSeconds: 60
    memoryMiB: 128
  permissions: [target.http.authenticated-lab]
  execution:
    isolation: container
  riskClass: high
