apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.body-robustness
  version: 1.0.1
  name: Robustez da validação de corpo no servidor (WEB-INJ-03)
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [WEB-INJ-03]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      methods: [POST]
      requestBodyBytes: 1048576
      requestContentTypes: [application/json, text/plain]
      writeRequests: 8
      maxRequests: 10
      bodyBytes: 65536
  resources:
    timeoutSeconds: 40
    memoryMiB: 128
  permissions: [target.http.lab-active]
  execution:
    isolation: container
  riskClass: medium
