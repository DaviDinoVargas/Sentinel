apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.net.asn-info
  version: 1.0.0
  name: Registro externo de ASN para o alvo (NET-ASN-01)
spec:
  type: dast
  contractVersion: "1.0"
  mode: passive
  controls: [NET-ASN-01]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
  resources:
    timeoutSeconds: 10
    memoryMiB: 128
  permissions: [target.http.passive]
  execution:
    isolation: container
  riskClass: low
