apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.http.csp-quality
  version: 1.0.0
  name: Qualidade das diretivas do CSP (WEB-CFG-07)
spec:
  type: dast
  contractVersion: "1.0"
  mode: passive
  controls: [WEB-CFG-07]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      headerCount: 128
      headerValueLength: 4096
      headerBytes: 32768
  resources:
    timeoutSeconds: 10
    memoryMiB: 128
  permissions: [target.http.passive]
  execution:
    isolation: container
  riskClass: low
