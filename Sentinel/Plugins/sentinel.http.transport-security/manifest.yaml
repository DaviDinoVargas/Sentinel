apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.http.transport-security
  version: 1.0.0
  name: HSTS, protocolo TLS e redirecionamento http→https (TLS-01)
spec:
  type: dast
  contractVersion: "1.0"
  mode: passive
  controls: [TLS-01]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      headerCount: 128
      headerValueLength: 4096
      headerBytes: 32768
      plainHttpCounterpart: true
  resources:
    timeoutSeconds: 10
    memoryMiB: 128
  permissions: [target.http.passive]
  execution:
    isolation: container
  riskClass: low
