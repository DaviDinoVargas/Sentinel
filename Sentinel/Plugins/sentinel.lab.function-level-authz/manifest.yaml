apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.function-level-authz
  version: 1.0.1
  name: Autorização em nível de função com papel privilegiado e menor (API-AUTHZ-06)
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [API-AUTHZ-06]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    openApiRead: true
    gateway:
      identity: dual
      loginRequests: 2
      arbitraryPaths: true
      methods: [GET, POST, PUT, PATCH]
      requestBodyBytes: 65536
      requestContentTypes: [application/json]
      writeRequests: 12
      maxRequests: 60
      bodyBytes: 65536
  resources:
    timeoutSeconds: 60
    memoryMiB: 128
  permissions: [project.openapi.read, target.http.authenticated-lab]
  execution:
    isolation: container
  riskClass: medium
