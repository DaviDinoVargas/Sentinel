apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.http.host-header-trust
  version: 1.0.0
  name: Confiança no Host/forwarded header (WEB-CFG-06)
spec:
  type: dast
  contractVersion: "1.0"
  mode: passive
  controls: [WEB-CFG-06]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
  resources:
    timeoutSeconds: 10
    memoryMiB: 128
  permissions: [target.http.passive]
  execution:
    isolation: container
  riskClass: low
