apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.object-level-authz
  version: 1.0.0
  name: Autorização em nível de objeto com duas identidades (API-AUTHZ-02)
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [API-AUTHZ-02]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    openApiRead: true
    gateway:
      identity: dual
      arbitraryPaths: true
      bodyBytes: 131072
      maxRequests: 120
  resources:
    timeoutSeconds: 60
    memoryMiB: 128
  permissions: [project.openapi.read, target.http.authenticated-lab]
  execution:
    isolation: container
  riskClass: medium
