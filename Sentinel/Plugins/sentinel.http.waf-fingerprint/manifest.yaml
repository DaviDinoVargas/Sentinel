apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.http.waf-fingerprint
  version: 1.0.0
  name: Fingerprinting passivo de WAF/CDN/IPS (NET-WAF-01)
spec:
  type: dast
  contractVersion: "1.0"
  mode: passive
  controls: [NET-WAF-01]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      headerCount: 128
      headerValueLength: 4096
      headerBytes: 32768
      cookieAttributes: true
  resources:
    timeoutSeconds: 10
    memoryMiB: 128
  permissions: [target.http.passive]
  execution:
    isolation: container
  riskClass: low
