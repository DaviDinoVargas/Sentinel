apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.jwt-lifecycle
  version: 1.0.0
  name: Metadados estruturais do JWT emitido pelo alvo (AUTH-JWT-02)
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [AUTH-JWT-02]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      identity: primary
      tokenMetadata: true
      maxRequests: 5
      bodyBytes: 4096
  resources:
    timeoutSeconds: 20
    memoryMiB: 128
  permissions: [target.http.authenticated-lab]
  execution:
    isolation: container
  riskClass: low
