apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.source.openapi
  version: 1.0.0
  name: Inventário OpenAPI JSON em snapshot (SRC-API-01)
spec:
  type: api-discovery
  contractVersion: "1.0"
  mode: passive
  controls: [SRC-API-01]
  capabilities:
    network: "false"
    sourceRead: true
    artifactWrite: false
  resources:
    timeoutSeconds: 30
    memoryMiB: 128
  permissions: [target.source.read]
  execution:
    isolation: container
  riskClass: low
