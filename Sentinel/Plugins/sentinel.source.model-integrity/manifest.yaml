apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.source.model-integrity
  version: 1.0.0
  name: Integridade de modelos e binários de ML (SUP-03)
spec:
  type: dependency-analyzer
  contractVersion: "1.0"
  mode: passive
  controls: [SUP-03]
  capabilities:
    network: "false"
    sourceRead: true
    artifactWrite: false
  resources:
    timeoutSeconds: 60
    memoryMiB: 256
  permissions: [target.source.read]
  execution:
    isolation: container
  riskClass: low
