apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.source.secrets
  version: 1.0.0
  name: Candidatos a segredos no snapshot com Gitleaks 8.30.1 (SUP-04)
spec:
  type: secret-scanner
  contractVersion: "1.0"
  mode: passive
  controls: [SUP-04]
  capabilities:
    network: "false"
    sourceRead: true
    artifactWrite: false
  resources:
    timeoutSeconds: 90
    memoryMiB: 512
  permissions: [target.source.read]
  execution:
    isolation: container
  riskClass: low
