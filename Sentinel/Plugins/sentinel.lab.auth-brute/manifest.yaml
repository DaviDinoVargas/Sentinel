apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.auth-brute
  version: 1.0.0
  name: Limite de tentativas de login (AUTH-BRUTE-01, parcial)
spec:
  activation: explicit
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [AUTH-BRUTE-01]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      methods: [POST]
      requestBodyBytes: 2048
      requestContentTypes: [application/json]
      writeRequests: 12
      maxRequests: 15
      bodyBytes: 4096
  resources:
    timeoutSeconds: 30
    memoryMiB: 128
  permissions: [target.http.lab-active]
  execution:
    isolation: container
  riskClass: medium
