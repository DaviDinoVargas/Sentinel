apiVersion: sentinel.dev/v1
kind: PluginManifest
metadata:
  id: sentinel.lab.authenticated-access
  version: 1.1.0
  name: Acesso autenticado com expectativa explícita
spec:
  type: security-test
  contractVersion: "1.0"
  mode: active
  controls: [LAB-ACCESS-01]
  capabilities:
    network: scoped-egress
    sourceRead: false
    artifactWrite: false
    gateway:
      identity: primary
  resources:
    timeoutSeconds: 12
    memoryMiB: 128
  permissions: [target.http.authenticated-lab]
  execution:
    isolation: container
  riskClass: medium
